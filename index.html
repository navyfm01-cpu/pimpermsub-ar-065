<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>PIMPERMSUB AR #065</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui,sans-serif}#ui{position:fixed;z-index:20;left:0;right:0;bottom:12px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:10px}button,select{border:0;border-radius:12px;padding:11px 14px;font-size:14px;background:rgba(20,20,20,.82);color:#fff}#status{position:fixed;z-index:21;left:12px;top:12px;right:12px;background:rgba(0,0,0,.58);color:#fff;padding:9px 12px;border-radius:10px;font-size:13px}#mode{position:fixed;z-index:21;left:12px;top:54px;background:rgba(0,0,0,.58);color:#fff;padding:7px 10px;border-radius:10px;font-size:12px}#video{position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","mindar":"https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"}}</script></head><body><div id="status">กำลังเตรียม Prototype #065…</div><div id="mode">MODE: FULL OVERLAY</div><video id="video" playsinline muted preload="auto" crossorigin="anonymous"></video><div id="ui"><select id="modeSelect"><option value="full">Full Video Overlay</option><option value="alpha">Transparent / Alpha Video</option></select><button id="start">START AR</button><button id="stop">STOP</button><button id="sound">SOUND OFF</button><button id="fs">FULLSCREEN</button></div><script type="module">import * as THREE from 'three';import {MindARThree} from 'mindar';const s=document.getElementById('status'),m=document.getElementById('mode'),v=document.getElementById('video'),sel=document.getElementById('modeSelect');let mindar,anchor,plane,tex,mat,current='full',sound=false;function st(x){s.textContent=x}function material(){tex=new THREE.VideoTexture(v);tex.colorSpace=THREE.SRGBColorSpace;tex.minFilter=THREE.LinearFilter;tex.magFilter=THREE.LinearFilter;tex.generateMipmaps=false;return new THREE.MeshBasicMaterial({map:tex,transparent:current==='alpha',depthWrite:current!=='alpha',side:THREE.DoubleSide})}function rebuild(){if(!anchor)return;if(plane){anchor.group.remove(plane);plane.geometry.dispose();mat?.dispose();tex?.dispose()}mat=material();plane=new THREE.Mesh(new THREE.PlaneGeometry(1,1.3333333333),mat);anchor.group.add(plane)}async function setMode(x){current=x;m.textContent='MODE: '+(x==='alpha'?'TRANSPARENT / ALPHA':'FULL OVERLAY');v.pause();v.currentTime=0;v.src=x==='alpha'?'./1000033896-alpha.webm':'./1000033896.mp4';v.load();rebuild();st(x==='alpha'?'โหมด Alpha: ต้องใช้ไฟล์ WebM ที่มี Alpha channel จริง':'โหมด Full Overlay พร้อมใช้งาน')}async function build(){if(mindar)return;mindar=new MindARThree({container:document.body,imageTargetSrc:'./targets.mind',uiScanning:'no',uiLoading:'no',filterMinCF:0.0005,filterBeta:1000,warmupTolerance:8,missTolerance:12,targetFPS:30,maxTrack:1});anchor=mindar.addAnchor(0);rebuild();anchor.onTargetFound=async()=>{st('พบ Target ✓ กำลังแสดง AR');try{await v.play()}catch(e){}};anchor.onTargetLost=()=>{v.pause();st('ไม่พบ Target — เล็งกล้องไปที่ภาพ Target')}}document.getElementById('start').onclick=async()=>{try{await build();await mindar.start();st('AR ทำงานแล้ว — ส่องภาพ Target')}catch(e){st('เริ่ม AR ไม่สำเร็จ: '+(e?.message||e))}};document.getElementById('stop').onclick=async()=>{try{v.pause();if(mindar)await mindar.stop();st('หยุด AR แล้ว')}catch(e){}};document.getElementById('sound').onclick=async()=>{sound=!sound;v.muted=!sound;document.getElementById('sound').textContent=sound?'SOUND ON':'SOUND OFF';try{await v.play()}catch(e){}};document.getElementById('fs').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){}};sel.onchange=()=>setMode(sel.value);setMode('full');build().catch(console.error);</script></body></html>
